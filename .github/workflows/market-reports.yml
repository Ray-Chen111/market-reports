      - name: Generate report
        env:
          USE_GEMINI: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          FREE_AGGREGATE: "0"
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          MARKET_REPORT_BASE_URL: https://ray-chen111.github.io/market-reports
        run: python cloud/market_report.py --mode "${{ steps.mode.outputs.mode }}" --no-line
